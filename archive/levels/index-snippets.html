<!-- CSS: inside <style>, before </style> -->
<style>
#levels .lvtabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
#levels .lvtabs button{font:inherit;font-size:13px;font-weight:600;padding:4px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
#levels .lvtabs button.on{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
#levels svg{width:100%;height:auto;display:block;background:var(--bg);border:1px solid var(--line);border-radius:10px}
#levels svg text{font-family:-apple-system,BlinkMacSystemFont,Roboto,sans-serif;font-size:inherit;fill:var(--muted)}

#levels .lvkey i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
#levels td.tl,#levels th.tl{text-align:left}

</style>

<!-- NAV: in <nav>, after the Alerts link -->
  <a href="#levels" data-sec="levels">Levels</a>


<!-- SECTION: in <main>, before the 'events' section -->
  <details class="sec anchor" id="levels">
  <summary><span class="st">Levels</span><span class="muted" id="lvhint">loading…</span></summary>
  <div class="secbody">
  <div class="lvtabs" id="lvtabs"></div>
  <div id="lvchart"></div>
  <div class="lvkey"><span><i style="background:var(--amber)"></i>EMA 25</span><span><i style="background:var(--accent)"></i>EMA 50</span><span><i style="background:var(--muted)"></i>EMA 200</span><span><i style="background:color-mix(in srgb,var(--accent) 30%,transparent)"></i>Value area (VAL–VAH) · dashed = POC</span></div>
  <div class="box"><table>
    <thead><tr><th class="tl">Level</th><th>Price</th><th>From price now</th></tr></thead>
    <tbody id="lvrows"></tbody>
  </table></div>
  <p class="muted" id="lvmeta"></p>
  </div>
  </details>



<!-- SCRIPT: in the main <script>, before '// ---- DEX watchlist' -->
<script>
// ---- Levels: volume profiles, EMAs and the trader's lines, drawn here instead of TradingView
fetch("data/levels.json?t="+Date.now()).then(r=>r.json()).then(L=>{
  const C=L.coins||[]; if(!C.length){document.getElementById("lvhint").textContent="no coins yet";return;}
  const fp=(p,ref)=>{if(p==null)return"–";const a=Math.abs(ref||p);return a>=1000?p.toFixed(1):a>=10?p.toFixed(2):a>=1?p.toFixed(3):p.toPrecision(4);};
  const kc={entry:"var(--amber)",stop:"var(--down)",target:"var(--up)",alert:"var(--muted)",level:"var(--ink)",position:"var(--accent)"};
  let cur=0; try{cur=Math.max(0,C.findIndex(c=>c.coin===localStorage.getItem("lvcoin")));}catch(e){}
  const tabs=document.getElementById("lvtabs");
  function draw(i){
    cur=i; try{localStorage.setItem("lvcoin",C[i].coin);}catch(e){}
    [...tabs.children].forEach((b,j)=>b.classList.toggle("on",j===i));
    const narrow=document.getElementById("lvchart").clientWidth<600, keep=narrow?90:180, c0=C[i];
    const c={...c0}, S={}; for(const k in c0.series) S[k]=c0.series[k].slice(-keep);
    const n=S.t.length, W=narrow?520:960, H=narrow?600:430, padL=6, padR=narrow?132:150, padT=12, padB=narrow?30:24, fs=narrow?17:11;
    const px=c.price;
    // y range: candles + profiles in view + lines within ±45% of price
    let lo=Math.min(...S.ohlc.map(o=>o[2])), hi=Math.max(...S.ohlc.map(o=>o[1]));
    const lines=c.lines.filter(l=>Math.abs(l.price/px-1)<0.45);
    for(const l of lines){lo=Math.min(lo,l.price);hi=Math.max(hi,l.price);}
    for(const p of c.profiles){lo=Math.min(lo,p.val);hi=Math.max(hi,p.vah);}
    const pad=(hi-lo)*0.04; lo-=pad; hi+=pad;
    const y=v=>padT+(hi-v)/(hi-lo)*(H-padT-padB), cw=(W-padL-padR)/n, x=k=>padL+k*cw+cw/2;
    const t0=S.t[0], tN=S.t[n-1], xt=t=>t<=t0?padL:t>=tN?padL+(n-1)*cw+cw:padL+((t-t0)/(tN-t0))*(n-1)*cw;
    let g="";
    // grid + price labels
    for(let k=0;k<=5;k++){const v=lo+(hi-lo)*k/5;g+=`<line x1="${padL}" x2="${W-padR}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${W-padR+6}" y="${y(v)+4}">${fp(v,px)}</text>`;}
    // month ticks
    let lastM=-1; S.t.forEach((t,k)=>{const d=new Date(t),m=d.getUTCMonth();if(m!==lastM&&k>2){g+=`<text x="${x(k)}" y="${H-6}" text-anchor="middle">${d.toLocaleString("en",{month:"short",timeZone:"UTC"})}</text>`;}lastM=m;});
    // profiles: value-area box over the profile's dates, histogram, POC
    c.profiles.forEach((p,pi)=>{
      const a=xt(Date.parse(p.from)), b=p.to?xt(Date.parse(p.to)+864e5):W-padR, w=Math.max(b-a,2);
      g+=`<rect x="${a}" y="${y(p.vah)}" width="${w}" height="${Math.max(1,y(p.val)-y(p.vah))}" fill="var(--accent)" opacity=".10"/>`;
      const rows=p.hist.length, rh=(p.hi-p.lo)/rows;
      p.hist.forEach((h,r)=>{const v0=p.lo+r*rh,v1=v0+rh;if(v1<lo||v0>hi)return;const top=y(Math.min(v1,hi)),bot=y(Math.max(v0,lo));g+=`<rect x="${a}" y="${top}" width="${h*Math.min(w*0.35,170)}" height="${Math.max(0.5,bot-top-0.5)}" fill="var(--accent)" opacity=".28"/>`;});
      g+=`<line x1="${a}" x2="${a+w}" y1="${y(p.poc)}" y2="${y(p.poc)}" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="6 4"/>`;
      g+=`<text x="${Math.max(a,padL)+4}" y="${Math.max(fs+2,y(p.vah)-4)}" style="fill:var(--accent)">${p.label}</text>`;
    });
    // candles
    S.ohlc.forEach((o,k)=>{const up=o[3]>=o[0],col=up?"var(--up)":"var(--down)";g+=`<line x1="${x(k)}" x2="${x(k)}" y1="${y(o[1])}" y2="${y(o[2])}" stroke="${col}"/><rect x="${x(k)-cw*0.35}" y="${y(Math.max(o[0],o[3]))}" width="${cw*0.7}" height="${Math.max(1,Math.abs(y(o[0])-y(o[3])))}" fill="${col}"/>`;});
    // EMAs
    [["d25","var(--amber)"],["d50","var(--accent)"],["d200","var(--muted)"]].forEach(([k,col])=>{const pts=S[k].map((v,j)=>v==null||v<lo||v>hi?null:`${x(j).toFixed(1)},${y(v).toFixed(1)}`).filter(Boolean).join(" ");if(pts)g+=`<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.6"/>`;});
    // the trader's lines
    lines.forEach(l=>{const col=kc[l.kind]||kc.level;let ly=y(l.price)+4;const d=ly-(y(px)+4);if(Math.abs(d)<fs*1.6)ly=y(px)+4+(d<0?-1:1)*fs*1.6;g+=`<line x1="${padL}" x2="${W-padR}" y1="${y(l.price)}" y2="${y(l.price)}" stroke="${col}" stroke-width="1.3" ${l.kind==="alert"?'stroke-dasharray="2 4"':""}/><text x="${W-padR+6}" y="${ly}" style="fill:${col};font-weight:600">${fp(l.price,px)} ${narrow?"":l.label.replace(/^Alert: /,"⏰ ").slice(0,16)}</text>`;});
    // price now
    g+=`<line x1="${padL}" x2="${W-padR}" y1="${y(px)}" y2="${y(px)}" stroke="var(--ink)" stroke-dasharray="1 3"/><rect x="${W-padR+2}" y="${y(px)-fs*0.85}" width="${fs*6}" height="${fs*1.6}" rx="4" fill="var(--ink)"/><text x="${W-padR+6}" y="${y(px)+4}" style="fill:var(--bg);font-weight:700">${fp(px,px)}</text>`;
    document.getElementById("lvchart").innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${c.name} daily chart with levels" style="font-size:${fs}px">${g}</svg>`;
    // table: every level, highest first
    const rows=[...c.lines.map(l=>({p:l.price,t:l.label,col:kc[l.kind]||kc.level})),
      ...c.profiles.flatMap(p=>[{p:p.vah,t:`VAH · ${p.label}`},{p:p.poc,t:`POC · ${p.label}`},{p:p.val,t:`VAL · ${p.label}`}]),
      {p:c.ema.d25,t:"Daily EMA 25"},{p:c.ema.d50,t:"Daily EMA 50"},{p:c.ema.d100,t:"Daily EMA 100"},{p:c.ema.d200,t:"Daily EMA 200"},{p:c.ema.w25,t:"Weekly EMA 25"},{p:c.ema.w50,t:"Weekly EMA 50"},
      {p:px,t:"<b>Price now</b>",now:1}].filter(r=>r.p!=null).sort((a,b)=>b.p-a.p);
    document.getElementById("lvrows").innerHTML=rows.map(r=>`<tr${r.now?' style="background:var(--soft)"':""}><td class="tl"${r.col?` style="color:${r.col};font-weight:600"`:""}>${r.t}</td><td>${fp(r.p,px)}</td><td>${r.now?"":`<span class="${r.p>px?"up":"down"}">${r.p>px?"+":""}${((r.p/px-1)*100).toFixed(1)}%</span>`}</td></tr>`).join("");
  }
  tabs.innerHTML=C.map((c,i)=>`<button type="button">${c.name}</button>`).join("");
  [...tabs.children].forEach((b,i)=>b.onclick=()=>draw(i));
  draw(cur);
  let wasNarrow=document.getElementById("lvchart").clientWidth<600;
  addEventListener("resize",()=>{const nw=document.getElementById("lvchart").clientWidth<600;if(nw!==wasNarrow){wasNarrow=nw;draw(cur);}});
  document.getElementById("levels").addEventListener("toggle",()=>draw(cur));
  document.getElementById("lvhint").textContent=C.map(c=>c.name).join(" · ");
  document.getElementById("lvmeta").textContent=`Daily candles and volume from Hyperliquid. Entry, stop and take-profit lines are your open Hyperliquid orders, read each hour. Profiles: 70% value area from 1-hour candles (4-hour for ranges older than ~200 days), so levels can differ slightly from TradingView. Updated ${ist(L.generated_at,true)}.`;
}).catch(()=>{document.getElementById("lvhint").textContent="appears after the next hourly scan";});


</script>
