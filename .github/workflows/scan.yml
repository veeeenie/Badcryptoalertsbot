name: Setup scan

# GitHub's scheduler often delays or drops cron runs, so a scheduled run doesn't scan once and stop:
# it scans every hour at :07 UTC for about 5.5 hours. Scheduled triggers that land meanwhile wait
# in the queue and take over when it ends, so one landed trigger every few hours keeps scans hourly.
# Pushes to the scanner code and the manual "Run workflow" button do a single scan straight away.
on:
  push:
    branches: [main]
    paths: ["scanner/journal.py", "scanner/scan.py", "scanner/watchlist.py", "scanner/alerts_cmd.py", "scanner/fills.py", "scanner/risk.py", ".github/workflows/scan.yml"]
  schedule:
    - cron: "7,37 * * * *"   # two chances an hour for GitHub to start the loop
  workflow_dispatch: {}      # "Run workflow" button for a manual scan

permissions:
  contents: write

concurrency:
  group: setup-scan-${{ github.event_name == 'schedule' && 'loop' || 'once' }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r scanner/requirements.txt

      - name: Scan (hourly loop on schedule, once otherwise)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOURNAL_WALLETS: "0xaBA792B28CA16629b3CFF232F30E9dC0868e5EaE:2026-10-09,0xfb4e07C7BF05464e6206abc93873078f2fc53991:2026-10-23"
          LOOP_MINUTES: ${{ github.event_name == 'schedule' && '330' || '0' }}
        run: |
          git config user.name "setup-scanner"
          git config user.email "actions@users.noreply.github.com"
          end=$(( $(date +%s) + LOOP_MINUTES * 60 ))
          while :; do
            # pick up the latest code and alert state before every scan
            git pull -q --rebase --autostash origin main || git rebase --abort 2>/dev/null || true
            python scanner/scan.py || echo "::warning::scan failed"
            python scanner/journal.py
            (cd scanner && python watchlist.py) || echo "::warning::watchlist failed"
            git add docs/data/setups.json docs/data/state.json
            [ -f docs/data/journal.json ] && git add docs/data/journal.json
            [ -f docs/data/portfolio.json ] && git add docs/data/portfolio.json
            [ -f docs/data/activity.json ] && git add docs/data/activity.json
            [ -f docs/data/watchlist.json ] && git add docs/data/watchlist.json
            git add docs/data/alerts.json
            if ! git diff --cached --quiet; then
              git commit -q -m "Scan $(date -u +'%Y-%m-%d %H:%M') UTC"
              # keep this run's generated files whole: a line-by-line rebase merge of two scans' JSON can
              # duplicate rows (seen 30 Oct 2026), so after rebasing they are put back exactly as written
              GEN="setups.json state.json journal.json portfolio.json activity.json watchlist.json"
              mkdir -p "$RUNNER_TEMP/gen"; for f in $GEN; do [ -f docs/data/$f ] && cp docs/data/$f "$RUNNER_TEMP/gen/"; done
              for i in 1 2 3; do
                git pull -q --rebase -X theirs origin main || { git rebase --abort 2>/dev/null; sleep 5; continue; }
                for f in $GEN; do [ -f "$RUNNER_TEMP/gen/$f" ] && cp "$RUNNER_TEMP/gen/$f" docs/data/$f && git add docs/data/$f; done
                git diff --cached --quiet || git commit -q --amend --no-edit
                git push -q origin HEAD:main && break
                sleep 5
              done
            fi
            next=$(( ( $(date +%s) / 3600 + 1 ) * 3600 + 420 ))   # next hour at :07 UTC
            [ "$next" -gt "$end" ] && break
            echo "next scan at $(date -u -d @$next +%H:%M) UTC"
            # between scans: check the trading wallet for filled and rejected orders every 2 minutes (Telegram alert)
            while [ "$(date +%s)" -lt "$next" ]; do
              python scanner/fills.py
              if [ -n "$(git status --porcelain docs/data/fills_state.json)" ]; then
                git add docs/data/fills_state.json && git commit -q -m "Fill alerts $(date -u +'%H:%M') UTC"
                for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && break; sleep 5; done
              fi
              left=$(( next - $(date +%s) )); [ "$left" -gt 120 ] && left=120; [ "$left" -gt 0 ] && sleep $left
            done
          done
