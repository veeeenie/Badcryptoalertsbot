name: Setup scan

on:
  schedule:
    - cron: "7 * * * *"   # every hour at :07 UTC
  workflow_dispatch: {}    # "Run workflow" button for a manual scan

permissions:
  contents: write

concurrency:
  group: setup-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r scanner/requirements.txt

      - name: Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner/scan.py

      - name: Save results
        run: |
          git config user.name "setup-scanner"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/setups.json docs/data/state.json
          git diff --cached --quiet && exit 0
          git commit -m "Scan $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash
          git push
