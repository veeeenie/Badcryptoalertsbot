name: Rates test (temporary)
on:
  push:
    branches: [debug-weekly]
    paths: [".github/workflows/dump.yml"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          pip -q install requests
          python scanner/rates.py > fred.txt 2>&1; python scanner/rates.py >> fred.txt 2>&1; cat docs/data/rates.json >> fred.txt
          git config user.name "setup-scanner"; git config user.email "actions@users.noreply.github.com"
          git add fred.txt && git commit -qm "rates3" && git push -q origin HEAD:debug-weekly
