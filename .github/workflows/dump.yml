name: ETH check (temporary)
on:
  push:
    branches: [debug-weekly]
    paths: [".github/workflows/dump.yml"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with: {ref: main, path: main}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -r main/scanner/requirements.txt
      - run: |
          cd main/scanner && python - > ../../eth_check.txt 2>&1 <<'PY'
          import time, json, requests, watchlist as W
          from scan import daily_candles, weekly_from_daily
          now=int(time.time()*1000)
          mids=requests.post("https://api.hyperliquid.xyz/info",json={"type":"allMids"}).json()
          d=daily_candles("ETH"); wk=weekly_from_daily(d)
          closed=[w for w in wk if w["t"]+7*86400000<=now]
          price=float(mids["ETH"])
          trend,info=W.weekly_trend(closed,price)
          A=W.atr_series(closed)[-1]
          print("time",time.strftime("%Y-%m-%d %H:%M UTC",time.gmtime()),"price",price,"trend",trend,"ATR",round(A,1),"weeks",len(closed))
          print("info",json.dumps(info,default=str)[:900])
          for z in W.zones(closed): print("zone",z["kind"],round(z["bottom"],1),round(z["top"],1),"h_atr",round((z["top"]-z["bottom"])/A,2),"tests",z["tests"],"formed",W.iso(z["formed"]))
          print("rejection short",W.rejection_level(closed,True,A),"long",W.rejection_level(closed,False,A))
          for t in ("down","up"):
              p,why=W.plan(closed,price,t,info,d[-2]["c"])
              print("plan as",t,":",why if p is None else json.dumps({k:p[k] for k in ["side","zone_low","zone_high","entries","stop","tps","rr","rr_first_only","distance_pct","status"]}))
          print("weeks:",[(W.iso(w["t"]),round(w["o"]),round(w["h"]),round(w["l"]),round(w["c"])) for w in wk[-14:]])
          print("days:",[(W.iso(x["t"]),round(x["h"]),round(x["l"]),round(x["c"])) for x in d[-8:]])
          import statistics
          def ema(v,n):
              a=2/(n+1);e=v[0];o=[]
              for x in v: e=a*x+(1-a)*e;o.append(e)
              return o[-1]
          dc=[x["c"] for x in d[:-1]]
          print("daily ema25/50/100",round(ema(dc,25)),round(ema(dc,50)),round(ema(dc,100)))
          wc=[x["c"] for x in closed]
          print("weekly ema25/50/100",round(ema(wc,25)),round(ema(wc,50)),round(ema(wc,100)))
          PY
          cd ../.. && git config user.name "setup-scanner" && git config user.email "actions@users.noreply.github.com"
          git add eth_check.txt && git commit -qm "eth check" && git push -q origin HEAD:debug-weekly
