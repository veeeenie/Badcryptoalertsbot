name: Market cap ranks (temporary)
on:
  push:
    branches: [debug-weekly]
    paths: [".github/workflows/dump.yml"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          {
          for pg in 1 2; do curl -s "https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=250&page=$pg" -H "accept: application/json" -o cg$pg.json; sleep 3; done
          python3 - <<'PY'
          import json, requests
          rows=json.load(open('cg1.json'))+json.load(open('cg2.json'))
          print('coingecko rows',len(rows))
          for r in rows:
              if r.get('market_cap_rank') in (100,150,200,250,300): print('rank',r['market_cap_rank'],r['symbol'],r['name'],r['market_cap'])
          meta,ctx=requests.post('https://api.hyperliquid.xyz/info',json={'type':'metaAndAssetCtxs'}).json()
          act=[(a['name'],float(c['dayNtlVlm'])) for a,c in zip(meta['universe'],ctx) if not a.get('isDelisted')]
          print('HL active perps',len(act))
          syms={}
          for r in rows: syms.setdefault(r['symbol'].upper(),r)
          hit=0; miss=[]
          for n,_ in act:
              k=n[1:] if n.startswith('k') and n[1:].isupper() else n
              if k in syms: hit+=1
              else: miss.append(n)
          print('HL perps found in CoinGecko top 500:',hit,'not found:',len(miss), miss[:60])
          ranks=sorted(syms[(n[1:] if n.startswith('k') and n[1:].isupper() else n)]['market_cap_rank'] or 999 for n,_ in act if (n[1:] if n.startswith('k') and n[1:].isupper() else n) in syms)
          print('HL perps by CG rank buckets: <=100',sum(1 for r in ranks if r<=100),'101-200',sum(1 for r in ranks if 100<r<=200),'201-500',sum(1 for r in ranks if r>200))
          PY
          } > mcap.txt 2>&1
          git config user.name "setup-scanner"; git config user.email "actions@users.noreply.github.com"
          git add mcap.txt && git commit -qm "mcap" && git push -q origin HEAD:debug-weekly
