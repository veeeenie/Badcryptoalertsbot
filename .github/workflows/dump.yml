name: Journal check (temporary)
on:
  push:
    branches: [debug-weekly]
    paths: [".github/workflows/dump.yml"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          python3 - > jcheck.txt 2>&1 <<'PY'
          import json, time, urllib.request
          from collections import defaultdict
          H="https://api.hyperliquid.xyz/info"
          def P(b):
              r=urllib.request.Request(H,data=json.dumps(b).encode(),headers={'Content-Type':'application/json'}); return json.load(urllib.request.urlopen(r,timeout=30))
          W={"5EaE":("0xaBA792B28CA16629b3CFF232F30E9dC0868e5EaE",1791504000000),"3991":("0xfb4e07C7BF05464e6206abc93873078f2fc53991",1792713600000)}
          for lab,(u,st) in W.items():
              fills=[]; t=st
              while True:
                  r=P({"type":"userFillsByTime","user":u,"startTime":t,"aggregateByTime":True})
                  if not r: break
                  fills+=r
                  if len(r)<2000: break
                  t=r[-1]["time"]+1
              per=defaultdict(lambda:[0.0,0.0,0])
              for f in fills:
                  p=per[f["coin"]]; p[0]+=float(f["closedPnl"]); p[1]+=float(f["fee"]); p[2]+=1
              tot=sum(v[0]-v[1] for v in per.values())
              print("WALLET",lab,"fills",len(fills),"net closedPnl-fees",round(tot,2))
              for c,v in sorted(per.items()): print("  ",c,"pnl",round(v[0],3),"fees",round(v[1],3),"net",round(v[0]-v[1],3),"fills",v[2])
              ex=[f for f in fills if f["coin"].startswith("#")][:6]
              for f in ex: print("  sample#",json.dumps(f)[:400])
              vv=[f for f in fills if f["coin"]=="VVV" and f["time"]>1762300000000]
              for f in vv: print("  VVV",time.strftime("%d-%b %H:%M",time.gmtime(f["time"]/1000+19800)),f["dir"],f["sz"],f["px"],f["closedPnl"],f.get("oid"))
          o=P({"type":"historicalOrders","user":W["5EaE"][0]})
          for x in o:
              od=x["order"]
              if od["coin"]=="VVV" and x["statusTimestamp"]>1762300000000+0: print("  VVVord",time.strftime("%d-%b %H:%M",time.gmtime(x["statusTimestamp"]/1000+19800)),x["status"],od["orderType"],od["side"],od.get("origSz"),od.get("triggerPx"),od["limitPx"])
          for c in ["#232020","#175360"]:
              pass
          sm=P({"type":"spotMeta"}); print("spot tokens with #?", [t["name"] for t in sm["tokens"] if t["name"].startswith("#")][:5])
          PY
          git config user.name "setup-scanner"; git config user.email "actions@users.noreply.github.com"
          git add jcheck.txt && git commit -qm "jcheck" && git push -q origin HEAD:debug-weekly
