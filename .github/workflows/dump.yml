name: NEAR TP check (temporary)
on:
  push:
    branches: [debug-weekly]
    paths: [".github/workflows/dump.yml"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          U=0xaBA792B28CA16629b3CFF232F30E9dC0868e5EaE
          H=https://api.hyperliquid.xyz/info
          p(){ curl -s -X POST $H -H 'Content-Type: application/json' -d "$1"; }
          S=$(( ($(date +%s) - 10*86400) * 1000 ))
          {
          echo "== open"; p "{\"type\":\"frontendOpenOrders\",\"user\":\"$U\"}"; echo
          echo "== hist"; p "{\"type\":\"historicalOrders\",\"user\":\"$U\"}"; echo
          echo "== candles"; p "{\"type\":\"candleSnapshot\",\"req\":{\"coin\":\"NEAR\",\"interval\":\"1h\",\"startTime\":$S}}"; echo
          echo "== fills"; p "{\"type\":\"userFillsByTime\",\"user\":\"$U\",\"startTime\":$S}"; echo
          echo "== ctx"; p '{"type":"metaAndAssetCtxs"}' | python3 -c "import json,sys;m,c=json.load(sys.stdin);print([ (a['name'],x['markPx'],x['oraclePx']) for a,x in zip(m['universe'],c) if a['name']=='NEAR'])"
          } > near_check.txt 2>&1
          git config user.name "setup-scanner"; git config user.email "actions@users.noreply.github.com"
          git add near_check.txt && git commit -qm "near check" && git push -q origin HEAD:debug-weekly
