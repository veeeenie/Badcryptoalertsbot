name: Predict test (temporary)
on:
  push:
    branches: [debug-weekly]
    paths: [".github/workflows/dump.yml"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          pip -q install requests
          (time python scanner/predict.py > probe.txt 2>&1 || true) 2>> probe.txt
          git config user.name "setup-scanner"; git config user.email "actions@users.noreply.github.com"
          git add -f probe.txt docs/data/predict.json; git commit -qm "predict1" && git push -q origin HEAD:debug-weekly
