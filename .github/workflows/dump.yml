name: Market test (temporary)
on:
  push:
    branches: [debug-weekly]
    paths: [".github/workflows/dump.yml"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with: {ref: main, path: main}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -r main/scanner/requirements.txt
      - run: |
          cd main/scanner && (python market.py > ../../mkt.txt 2>&1 || true) && cp ../docs/data/market.json ../../market_test.json 2>/dev/null || true
          cd ../.. && git config user.name "setup-scanner" && git config user.email "actions@users.noreply.github.com"
          git add mkt.txt market_test.json 2>/dev/null; git add mkt.txt; git commit -qm "mkt test" && git push -q origin HEAD:debug-weekly
