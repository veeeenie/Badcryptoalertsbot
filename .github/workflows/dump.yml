name: Orders dump (temporary)
on:
  push:
    branches: [debug-weekly]
    paths: [".github/workflows/dump.yml"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          python3 - > orders.json <<'PY'
          import json, urllib.request
          W="0xaBA792B28CA16629b3CFF232F30E9dC0868e5EaE"
          def hl(b):
              r=urllib.request.Request("https://api.hyperliquid.xyz/info",data=json.dumps(b).encode(),headers={"Content-Type":"application/json"})
              return json.load(urllib.request.urlopen(r,timeout=30))
          out={}
          out["state"]=hl({"type":"clearinghouseState","user":W})
          out["state_xyz"]=hl({"type":"clearinghouseState","user":W,"dex":"xyz"})
          out["orders"]=hl({"type":"frontendOpenOrders","user":W})
          out["orders_xyz"]=hl({"type":"frontendOpenOrders","user":W,"dex":"xyz"})
          out["mids"]=hl({"type":"allMids"})
          out["mids_xyz"]=hl({"type":"allMids","dex":"xyz"})
          out["spot"]=hl({"type":"spotClearinghouseState","user":W})
          import time; out["t"]=time.time()
          print(json.dumps(out))
          PY
          git config user.name "setup-scanner"; git config user.email "actions@users.noreply.github.com"
          git add orders.json && git commit -qm "orders1" && git push -q origin HEAD:debug-weekly
