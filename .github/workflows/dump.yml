name: Real yield range (temporary)
on:
  push:
    branches: [debug-weekly]
    paths: [".github/workflows/dump.yml"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          for y in 2024 2025 2026; do curl -sL -m 40 -A "Mozilla/5.0" "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/$y/all?type=daily_treasury_real_yield_curve&field_tdr_date_value=$y&page&_format=csv" | tail -n +2; done > ry.csv
          python3 - > fred.txt <<'PY'
          import csv
          rows=[(r[0],float(r[3])) for r in csv.reader(open("ry.csv")) if len(r)>3 and r[3]]
          rows.sort(key=lambda x:(x[0][6:],x[0][:5]))
          for y in ("2024","2025","2026"):
              v=[x for x in rows if x[0].endswith(y)]
              lo=min(v,key=lambda x:x[1]); hi=max(v,key=lambda x:x[1])
              print(y,"first",v[0],"last",v[-1],"low",lo,"high",hi)
          # month-end values for 2026
          last={}
          for d,x in rows:
              if d.endswith("2026"): last[d[:2]]=(d,x)
          print("month ends 2026:",[last[k] for k in sorted(last)])
          PY
          git config user.name "setup-scanner"; git config user.email "actions@users.noreply.github.com"
          git add fred.txt && git commit -qm "fred3" && git push -q origin HEAD:debug-weekly
