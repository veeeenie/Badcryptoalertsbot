name: VVV live (temporary)
on:
  push:
    branches: [debug-weekly]
    paths: [".github/workflows/dump.yml"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          python3 - > vvvlive.txt 2>&1 <<'PY'
          import json, time, urllib.request
          H="https://api.hyperliquid.xyz/info"
          def P(b):
              r=urllib.request.Request(H,data=json.dumps(b).encode(),headers={'Content-Type':'application/json'}); return json.load(urllib.request.urlopen(r,timeout=30))
          print(time.strftime("%Y-%m-%d %H:%M UTC",time.gmtime()))
          m=P({"type":"allMids"}); print("VVV",m["VVV"],"JUP",m["JUP"],"BTC",m["BTC"])
          now=int(time.time()*1000)
          d=P({"type":"candleSnapshot","req":{"coin":"VVV","interval":"1d","startTime":now-16*86400000,"endTime":now}})
          for c in d: print(time.strftime("%d-%b",time.gmtime(c["t"]/1000)),c["o"],c["h"],c["l"],c["c"])
          meta,ctx=P({"type":"metaAndAssetCtxs"})
          for a,c in zip(meta["universe"],ctx):
              if a["name"]=="VVV": print("funding",float(c["funding"])*24*365*100,"%/yr OI",float(c["openInterest"])*float(c["markPx"]),"maxLev",a["maxLeverage"])
          PY
          git config user.name "setup-scanner"; git config user.email "actions@users.noreply.github.com"
          git add vvvlive.txt && git commit -qm "vvv live" && git push -q origin HEAD:debug-weekly
