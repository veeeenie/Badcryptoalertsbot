name: Ticker lookup (temporary)
on:
  push:
    branches: [debug-weekly]
    paths: [".github/workflows/dump.yml"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          python3 - <<'PY'
          import json, time, urllib.request
          def hl(p):
              r = urllib.request.Request("https://api.hyperliquid.xyz/info", data=json.dumps(p).encode(), headers={"Content-Type": "application/json"})
              return json.load(urllib.request.urlopen(r, timeout=30))
          want = ("CHIP", "STONK")
          out = {"checked_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()), "perps": [], "spot": []}
          dexs = [""] + [d["name"] for d in hl({"type": "perpDexs"}) if d and d.get("name")]
          for d in dexs:
              meta, ctxs = hl({"type": "metaAndAssetCtxs", "dex": d} if d else {"type": "metaAndAssetCtxs"})
              for a, c in zip(meta["universe"], ctxs):
                  if any(w in a["name"].upper() for w in want):
                      out["perps"].append({"dex": d or "main", "asset": a, "ctx": c})
          smeta, sctx = hl({"type": "spotMetaAndAssetCtxs"})
          toks = {t["index"]: t for t in smeta["tokens"]}
          for u, c in zip(smeta["universe"], sctx):
              names = [toks[i]["name"] for i in u["tokens"]]
              if any(any(w in n.upper() for w in want) for n in names):
                  out["spot"].append({"pair": u, "tokens": names, "ctx": c, "token_info": [toks[i] for i in u["tokens"]]})
          json.dump(out, open("ticker_check.json", "w"), indent=1)
          PY
          git config user.name "setup-scanner"; git config user.email "actions@users.noreply.github.com"
          git add ticker_check.json && git commit -qm "ticker check" && git push -q origin HEAD:debug-weekly
