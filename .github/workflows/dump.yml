name: FRED test (temporary)
on:
  push:
    branches: [debug-weekly]
    paths: [".github/workflows/dump.yml"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          {
          echo "== FRED -L"; curl -sL -m 40 -A "Mozilla/5.0" -w "\nHTTP %{http_code}\n" "https://fred.stlouisfed.org/graph/fredgraph.csv?id=DFII10" | tail -8
          echo "== Treasury real"; curl -sL -m 40 -A "Mozilla/5.0" -w "\nHTTP %{http_code}\n" "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/2026/all?type=daily_treasury_real_yield_curve&field_tdr_date_value=2026&page&_format=csv" | head -12
          } > fred.txt 2>&1
          git config user.name "setup-scanner"; git config user.email "actions@users.noreply.github.com"
          git add fred.txt && git commit -qm "fred2" && git push -q origin HEAD:debug-weekly
