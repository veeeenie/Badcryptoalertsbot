name: Positions check (temporary)
on:
  push:
    branches: [debug-weekly]
    paths: [".github/workflows/dump.yml"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          python3 - > orders.json <<'PY'
          import json, urllib.request, time
          W="0xaBA792B28CA16629b3CFF232F30E9dC0868e5EaE"
          def hl(b):
              r=urllib.request.Request("https://api.hyperliquid.xyz/info",data=json.dumps(b).encode(),headers={"Content-Type":"application/json"})
              return json.load(urllib.request.urlopen(r,timeout=30))
          now=int(time.time()*1000)
          out={"t":now,"pos":[p["position"] for p in hl({"type":"clearinghouseState","user":W})["assetPositions"]],
               "orders":hl({"type":"frontendOpenOrders","user":W}),
               "fills":[f for f in hl({"type":"userFillsByTime","user":W,"startTime":now-3*3600000,"aggregateByTime":True})],
               "hist":[o for o in hl({"type":"historicalOrders","user":W}) if o["statusTimestamp"]>now-3*3600000],
               "mids":{k:v for k,v in hl({"type":"allMids"}).items() if k in ("VVV","JUP")}}
          print(json.dumps(out))
          PY
          git config user.name "setup-scanner"; git config user.email "actions@users.noreply.github.com"
          git add orders.json && git commit -qm "orders4" && git push -q origin HEAD:debug-weekly
