name: xyz balance check (temporary)
on:
  push:
    branches: [debug-weekly]
    paths: [".github/workflows/dump.yml"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          python3 - <<'PY'
          import json, time, urllib.request
          def hl(p):
              r = urllib.request.Request("https://api.hyperliquid.xyz/info", data=json.dumps(p).encode(), headers={"Content-Type": "application/json"})
              return json.load(urllib.request.urlopen(r, timeout=30))
          A = "0xaBA792B28CA16629b3CFF232F30E9dC0868e5EaE"
          out = {"checked_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())}
          for name, p in {
              "xyz_state": {"type": "clearinghouseState", "user": A, "dex": "xyz"},
              "main_state": {"type": "clearinghouseState", "user": A},
              "spot": {"type": "spotClearinghouseState", "user": A},
              "orders_main": {"type": "frontendOpenOrders", "user": A},
              "orders_xyz": {"type": "frontendOpenOrders", "user": A, "dex": "xyz"},
              "fills": {"type": "userFillsByTime", "user": A, "startTime": 1759968000000},
              "ledger": {"type": "userNonFundingLedgerUpdates", "user": A, "startTime": 1759968000000},
              "abstraction": {"type": "userAbstraction", "user": A},
          }.items():
              try: out[name] = hl(p)
              except Exception as e: out[name] = "ERR " + str(e)
          json.dump(out, open("xyz_check.json", "w"), indent=1)
          PY
          git config user.name "setup-scanner"; git config user.email "actions@users.noreply.github.com"
          git add xyz_check.json && git commit -qm "xyz check" && git push -q origin HEAD:debug-weekly
