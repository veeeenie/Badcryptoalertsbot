name: Dump daily candles (temporary)
on:
  push:
    branches: [debug-weekly]
    paths: [".github/workflows/dump.yml"]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: |
          git fetch -q origin main && git checkout origin/main -- scanner
          cd scanner && python - <<'PY'
          import json, gzip, time, scan
          out = {}
          for r in scan.universe():
              try:
                  out[r["coin"]] = {"price": r["price"], "max_lev": r["max_lev"], "daily": scan.daily_candles(r["coin"], days=1500)}
              except Exception as e:
                  print(r["coin"], e)
              time.sleep(0.3)
          with gzip.open("../daily_dump.json.gz", "wt") as f:
              json.dump(out, f)
          print(len(out), "coins")
          PY
      - run: |
          git config user.name "setup-scanner"; git config user.email "actions@users.noreply.github.com"
          git rm -rq --cached scanner 2>/dev/null || true
          git add daily_dump.json.gz && git commit -qm "daily dump" && git push -q origin HEAD:debug-weekly
