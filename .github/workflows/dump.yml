name: BTC weekly (temporary)
on:
  push:
    branches: [debug-weekly]
    paths: [".github/workflows/dump.yml"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          {
          echo "== binance"; curl -s "https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT&interval=1w&startTime=1577836800000&limit=1000"; echo
          for s in 1577836800 1664236800 1750636800; do echo "== bitstamp $s"; curl -s "https://www.bitstamp.net/api/v2/ohlc/btcusd/?step=86400&limit=1000&start=$s"; echo; done
          } > btc_weekly.txt 2>&1
          git config user.name "setup-scanner"; git config user.email "actions@users.noreply.github.com"
          git add btc_weekly.txt && git commit -qm "btc weekly" && git push -q origin HEAD:debug-weekly
