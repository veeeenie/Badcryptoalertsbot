name: CASHCAT lookup (temporary)
on:
  push:
    branches: [debug-weekly]
    paths: [".github/workflows/dump.yml"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          H=https://api.hyperliquid.xyz/info
          p(){ curl -s -X POST $H -H 'Content-Type: application/json' -d "$1"; }
          {
          echo "== dexes"; p '{"type":"perpDexs"}' | head -c 3000; echo
          echo "== main"; p '{"type":"meta"}' | python3 -c "import json,sys;print([a['name'] for a in json.load(sys.stdin)['universe'] if 'CAT' in a['name'].upper()])"
          for d in cash xyz flx vntl hyna km abcd para mkts io; do echo "== dex $d"; p "{\"type\":\"metaAndAssetCtxs\",\"dex\":\"$d\"}" | python3 -c "
          import json,sys
          try:
            m,c=json.load(sys.stdin)
            for a,x in zip(m['universe'],c):
              if 'CAT' in a['name'].upper(): print(a['name'],x.get('markPx'),x.get('oraclePx'),x.get('dayNtlVlm'),x.get('openInterest'),a.get('maxLeverage'))
          except Exception as e: print('err',e)"; done
          echo "== spot"; p '{"type":"spotMeta"}' | python3 -c "import json,sys;print([t['name'] for t in json.load(sys.stdin)['tokens'] if 'CAT' in t['name'].upper()])"
          echo "== dexscreener"; curl -s "https://api.dexscreener.com/latest/dex/search?q=CASHCAT" | head -c 5000; echo
          } > cashcat.txt 2>&1
          git config user.name "setup-scanner"; git config user.email "actions@users.noreply.github.com"
          git add cashcat.txt && git commit -qm "cashcat" && git push -q origin HEAD:debug-weekly
