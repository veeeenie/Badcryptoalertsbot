name: Metric swaps (temporary)
on:
  push:
    branches: [debug-weekly]
    paths: [".github/workflows/dump.yml"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          (python3 - > probe.txt 2>&1 || true) <<'PY'
          import json, urllib.request, time
          A="0xaBA792B28CA16629b3CFF232F30E9dC0868e5EaE"
          B="https://robinhoodchain.blockscout.com/api/v2"
          def get(u):
              r=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0","accept":"application/json"})
              return json.load(urllib.request.urlopen(r,timeout=40))
          try:
              info=get(f"{B}/addresses/{A}"); print("addr", json.dumps({k:info.get(k) for k in ("coin_balance","has_token_transfers","is_contract")}))
          except Exception as e: print("addr err",e)
          out=[]; url=f"{B}/addresses/{A}/token-transfers"; params=""
          for page in range(10):
              d=get(url+params)
              for t in d.get("items",[]):
                  tok=t.get("token") or {}; tot=t.get("total") or {}
                  dec=int(tot.get("decimals") or tok.get("decimals") or 18); v=int(tot.get("value") or 0)/10**dec
                  out.append({"ts":t.get("timestamp"),"tx":t.get("transaction_hash"),"sym":tok.get("symbol"),"val":v,
                              "from":(t.get("from") or {}).get("hash"),"to":(t.get("to") or {}).get("hash"),"rate":tok.get("exchange_rate"),"method":t.get("method"),"type":t.get("type")})
              nxt=d.get("next_page_params")
              if not nxt: break
              params="?"+"&".join(f"{k}={v}" for k,v in nxt.items()); time.sleep(1)
          print(json.dumps(out))
          PY
          git config user.name "setup-scanner"; git config user.email "actions@users.noreply.github.com"
          git add -f probe.txt && git commit -qm "metric1" && git push -q origin HEAD:debug-weekly
