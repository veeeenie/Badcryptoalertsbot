name: HIP-4 probe 2 (temporary)
on:
  push:
    branches: [debug-weekly]
    paths: [".github/workflows/dump.yml"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          python3 - > probe.txt 2>&1 <<'PY'
          import json, urllib.request, collections, time
          def hl(b):
              r=urllib.request.Request("https://api.hyperliquid.xyz/info",data=json.dumps(b).encode(),headers={"Content-Type":"application/json"})
              return json.load(urllib.request.urlopen(r,timeout=30))
          meta=hl({"type":"outcomeMeta"}); m=hl({"type":"allMids"})
          print("keys",list(meta.keys()))
          for k in meta:
              if k!="outcomes": print(k, json.dumps(meta[k])[:1500])
          oc=meta["outcomes"]; live=[o for o in oc if f"#{o['outcome']*10}" in m]
          print("outcomes",len(oc),"live",len(live))
          print(collections.Counter((o["name"],o["venue"]) for o in live).most_common(30))
          bp=[o for o in live if o["name"]=="template:binaryPrice"]
          for o in sorted(bp,key=lambda o:o["description"].split("time:")[-1])[:60]: print(o["outcome"],o["venue"],o["description"],m.get(f"#{o['outcome']*10}"))
          print("sample other:",[ (o["name"],o["description"][:150]) for o in live if o["name"] not in("template:binaryPrice",)][:15])
          t=time.time()
          for o in bp[:3]:
              b=hl({"type":"l2Book","coin":f"#{o['outcome']*10}"}); print("book",o["outcome"],[l[:3] for l in b["levels"]])
          print("ctx try", str(hl({"type":"spotMetaAndAssetCtxs"})[1][:2])[:300])
          PY
          git config user.name "setup-scanner"; git config user.email "actions@users.noreply.github.com"
          git add probe.txt && git commit -qm "probe2" && git push -q origin HEAD:debug-weekly
