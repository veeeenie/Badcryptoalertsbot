name: CORS check (temporary)
on:
  push:
    branches: [debug-weekly]
    paths: [".github/workflows/dump.yml"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          {
          echo "== preflight"
          curl -s -i -X OPTIONS https://api.hyperliquid.xyz/info -H "Origin: https://veeeenie.github.io" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type" | head -20
          echo "== post"
          curl -s -i -X POST https://api.hyperliquid.xyz/info -H "Origin: https://veeeenie.github.io" -H "Content-Type: application/json" -d '{"type":"allMids"}' | head -15
          } > cors_check.txt 2>&1
          git config user.name "setup-scanner"; git config user.email "actions@users.noreply.github.com"
          git add cors_check.txt && git commit -qm "cors check" && git push -q origin HEAD:debug-weekly
