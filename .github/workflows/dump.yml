name: FRED test (temporary)
on:
  push:
    branches: [debug-weekly]
    paths: [".github/workflows/dump.yml"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          {
          for s in DFII10 DGS2 DFEDTARU T10YIE; do echo "== $s"; curl -s -m 30 -A "Mozilla/5.0" "https://fred.stlouisfed.org/graph/fredgraph.csv?id=$s&cosd=2026-08-01" | tail -6; done
          } > fred.txt 2>&1
          git config user.name "setup-scanner"; git config user.email "actions@users.noreply.github.com"
          git add fred.txt && git commit -qm "fred" && git push -q origin HEAD:debug-weekly
