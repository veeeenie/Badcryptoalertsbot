name: CAMBRICON ohlc (temporary)
on:
  push:
    branches: [debug-weekly]
    paths: [".github/workflows/dump.yml"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          (python3 - > probe.txt 2>&1 || true) <<'PY'
          import json, urllib.request, time
          def hl(b):
              r=urllib.request.Request("https://api.hyperliquid.xyz/info",data=json.dumps(b).encode(),headers={"Content-Type":"application/json"})
              return json.load(urllib.request.urlopen(r,timeout=30))
          now=int(time.time()*1000)
          for iv,days in (("1d",400),("4h",20)):
              cs=hl({"type":"candleSnapshot","req":{"coin":"xyz:CAMBRICON","interval":iv,"startTime":now-days*86400000,"endTime":now}})
              print(iv,len(cs)); print([(time.strftime('%m-%d %H',time.gmtime(x['t']/1000)),x['o'],x['h'],x['l'],x['c']) for x in cs])
          meta,ctx=hl({"type":"metaAndAssetCtxs","dex":"xyz"})
          for u,c in zip(meta["universe"],ctx):
              if u["name"]=="xyz:CAMBRICON": print(json.dumps(c))
          b=hl({"type":"l2Book","coin":"xyz:CAMBRICON"})["levels"]; print("book bids",b[0][:6]); print("book asks",b[1][:6])
          print("utc", time.strftime('%Y-%m-%d %H:%M',time.gmtime()))
          PY
          git config user.name "setup-scanner"; git config user.email "actions@users.noreply.github.com"
          git add -f probe.txt && git commit -qm "camb2" && git push -q origin HEAD:debug-weekly
