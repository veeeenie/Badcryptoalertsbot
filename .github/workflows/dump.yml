name: HIP-4 probe (temporary)
on:
  push:
    branches: [debug-weekly]
    paths: [".github/workflows/dump.yml"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          python3 - > probe.txt 2>&1 <<'PY'
          import json, urllib.request
          def hl(b):
              try:
                  r=urllib.request.Request("https://api.hyperliquid.xyz/info",data=json.dumps(b).encode(),headers={"Content-Type":"application/json"})
                  return json.load(urllib.request.urlopen(r,timeout=30))
              except Exception as e: return f"ERR {e}"
          m=hl({"type":"allMids"})
          outs={k:v for k,v in m.items() if k.startswith("#")}
          print("MIDS #:",len(outs),json.dumps(outs)[:1500])
          for t in ("outcomeMeta","outcomeMetaAndAssetCtxs","outcomes","questionMeta"):
              r=hl({"type":t}); print("==",t, json.dumps(r)[:3000] if not isinstance(r,str) else r)
          ks=sorted(outs, key=lambda k:int(k[1:]))[:4]
          for k in ks:
              b=hl({"type":"l2Book","coin":k}); print("== book",k,json.dumps(b)[:800])
          print("== spotMeta tokens w/ #?", [t for t in hl({"type":"spotMeta"})["tokens"] if "#" in t["name"]][:5])
          PY
          git config user.name "setup-scanner"; git config user.email "actions@users.noreply.github.com"
          git add probe.txt && git commit -qm "probe1" && git push -q origin HEAD:debug-weekly
