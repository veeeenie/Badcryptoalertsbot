name: JIO market check (temporary)
on:
  push:
    branches: [debug-weekly]
    paths: [".github/workflows/dump.yml"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          python3 - <<'PY'
          import json, time, urllib.request
          def hl(p):
              r = urllib.request.Request("https://api.hyperliquid.xyz/info", data=json.dumps(p).encode(), headers={"Content-Type": "application/json"})
              return json.load(urllib.request.urlopen(r, timeout=30))
          out = {"checked_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())}
          dexs = hl({"type": "perpDexs"}); out["perpDexs"] = dexs
          for d in dexs:
              if not d or not d.get("name"): continue
              try:
                  meta, ctxs = hl({"type": "metaAndAssetCtxs", "dex": d["name"]})
              except Exception as e:
                  out["err_" + d["name"]] = str(e); continue
              for a, c in zip(meta["universe"], ctxs):
                  if "JIO" in a["name"].upper():
                      key = a["name"]
                      out[key] = {"dex": d["name"], "asset": a, "ctx": c}
                      end = int(time.time() * 1000)
                      for itv, days in (("1h", 7), ("1d", 60)):
                          try:
                              out[key]["candles_" + itv] = hl({"type": "candleSnapshot", "req": {"coin": key, "interval": itv, "startTime": end - days * 86400000, "endTime": end}})
                          except Exception as e:
                              out[key]["candles_err_" + itv] = str(e)
                      try:
                          out[key]["funding"] = hl({"type": "fundingHistory", "coin": key, "startTime": end - 7 * 86400000})
                      except Exception as e:
                          out[key]["funding_err"] = str(e)
          json.dump(out, open("jio_check.json", "w"), indent=1)
          PY
          git config user.name "setup-scanner"; git config user.email "actions@users.noreply.github.com"
          git add jio_check.json && git commit -qm "jio check" && git push -q origin HEAD:debug-weekly
