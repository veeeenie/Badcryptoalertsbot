name: STONK lookup (temporary)
on:
  push:
    branches: [debug-weekly]
    paths: [".github/workflows/dump.yml"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          A=6GmAFSYs4gk3FDao5FzzySQpPZaWsa4rUJHacpMpUNgx
          {
          echo "== dexscreener token"; curl -s -i "https://api.dexscreener.com/latest/dex/tokens/$A" -H "Origin: https://veeeenie.github.io" | head -c 6000; echo
          echo "== dexscreener search"; curl -s "https://api.dexscreener.com/latest/dex/search?q=STONK" | head -c 4000; echo
          echo "== mexc ticker"; curl -s -i "https://api.mexc.com/api/v3/ticker/24hr?symbol=STONKUSDT" -H "Origin: https://veeeenie.github.io" | head -c 3000; echo
          echo "== mexc exchangeInfo"; curl -s "https://api.mexc.com/api/v3/exchangeInfo?symbol=STONKUSDT" | head -c 2500; echo
          } > stonk_check.txt 2>&1
          git config user.name "setup-scanner"; git config user.email "actions@users.noreply.github.com"
          git add stonk_check.txt && git commit -qm "stonk check" && git push -q origin HEAD:debug-weekly
