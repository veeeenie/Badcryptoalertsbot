name: Events test (temporary)
on:
  push:
    branches: [debug-weekly]
    paths: [".github/workflows/dump.yml"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install -q requests
      - run: |
          mkdir -p docs/data; (python scanner/events.py > probe.txt 2>&1 || true); cat docs/data/events.json >> probe.txt || true
          git config user.name "setup-scanner"; git config user.email "actions@users.noreply.github.com"
          git add -f probe.txt && git commit -qm "events4" && git push -q origin HEAD:debug-weekly
