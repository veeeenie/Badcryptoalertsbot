name: Bench data

# Downloads the test bench's candle history to the bench-data branch (kept off main so the repo stays small).
on:
  workflow_dispatch: {}
  schedule:
    - cron: "23 1 * * 1"   # Mondays, after the weekly close

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python bench/fetch_data.py
      - name: Push to the bench-data branch
        run: |
          mkdir -p /tmp/out && cp bench/data/candles_1d.json.gz /tmp/out/
          git config user.name "setup-scanner"; git config user.email "actions@users.noreply.github.com"
          git fetch -q origin bench-data && git checkout -q bench-data || git checkout -q --orphan bench-data
          git rm -rq --cached . 2>/dev/null || true
          mkdir -p bench/data && cp /tmp/out/candles_1d.json.gz bench/data/
          git add -f bench/data/candles_1d.json.gz
          git commit -qm "Bench data $(date -u +%F)" && git push -q -f origin HEAD:bench-data
