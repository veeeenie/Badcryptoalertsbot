<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Setup Desk</title>
<style>
:root{--bg:#f6f7f8;--panel:#fff;--ink:#17202a;--muted:#5f6b76;--line:#dfe3e7;--up:#147a52;--down:#b3372b;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11161b;--panel:#182029;--ink:#e6ebf0;--muted:#94a1ad;--line:#28323c;--up:#4cc39a;--down:#ef7a6e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11161b;--panel:#182029;--ink:#e6ebf0;--muted:#94a1ad;--line:#28323c;--up:#4cc39a;--down:#ef7a6e;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:0 16px}
main{max-width:1180px;margin:0 auto;padding:28px 0 48px;display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
h1{font-size:26px;margin:0}
h2{font-size:18px;margin:12px 0 -8px}
a{color:inherit}
.muted{color:var(--muted);font-size:13px}
.box{overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
tr:last-child td{border-bottom:0}
.up{color:var(--up)} .down{color:var(--down)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,350px),1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:8px;min-width:0}
.ch{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.ch .coin{font-size:17px;font-weight:700}
.ch .rr{margin-left:auto;font-size:14px}
.card table{table-layout:fixed;font-size:13px}
.card th,.card td{padding:4px 4px;white-space:normal;overflow-wrap:anywhere}
.card th:first-child,.card td:first-child{width:15%}
.card th{font-size:11px;letter-spacing:.02em}
.line{font-size:13.5px}
.line b{font-weight:600}
.warn{font-size:12.5px;color:var(--down)}
@media (max-width:760px){
  .stack thead{display:none}
  .stack tr{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;padding:8px 10px;border-bottom:1px solid var(--line)}
  .stack tr:last-child{border-bottom:0}
  .stack td{border:0;padding:0;text-align:left!important;white-space:normal}
  .stack td:first-child{grid-column:1/-1}
  .stack td[data-label]::before{content:attr(data-label) " ";color:var(--muted);font-size:12px}
}
</style>
</head>
<body>
<main>
  <header><h1>Setup Desk</h1><a href="rules.html">Rule book</a></header>
  <h2>Trade ideas</h2>
  <p class="muted" id="wmeta">Coins in a clear weekly trend with a plan at a weekly supply or demand zone. Orders wait at the zone; we don't chase.</p>
  <div class="cards" id="wrows"><p class="muted">Loading…</p></div>
  <p class="muted" id="wnone"></p>
  <h2>Journal</h2>
  <p class="muted" id="meta">Journal of trade.xyz trades since 9 Oct 2026.</p>
  <div class="box"><table class="stack">
    <thead><tr><th>Trade</th><th>Opened</th><th>Entry</th><th>Stop</th><th>Take-profit</th><th>Exit</th><th>Net $</th><th>R</th></tr></thead>
    <tbody id="rows"><tr><td colspan="8" class="muted">Loading…</td></tr></tbody>
  </table></div>
</main>
<script>
const f=x=>x==null?"–":(Math.abs(x)>=1000?x.toLocaleString("en-US",{maximumFractionDigits:0}):Math.abs(x)>=1?x.toFixed(3):x.toPrecision(4));
fetch("data/watchlist.json?t="+Date.now()).then(r=>r.json()).then(w=>{
  const c=w.counts, when=new Date(w.generated_at).toLocaleString([], {day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
  document.getElementById("wmeta").textContent=`${c.trades} trade ideas from the top ${w.scanned} coins. Each is at least ${w.gate_rr} : 1 with all orders filled and with only the first, at a weekly zone within 2 weekly ATRs of price. Sizes risk $${w.risk_usd} if every order fills and the stop is hit, split 20 : 30 : 50 toward the best price (orders under $10 merge into the next). Leverage is the highest that keeps liquidation (isolated margin) at least twice as far as the stop. Updated ${when}.`;
  const fs=x=>x>=1000?x.toLocaleString("en-US",{maximumFractionDigits:0}):x>=10?x.toFixed(1):x>=1?x.toFixed(2):x.toPrecision(3);
  const pct=(e,p)=>Math.abs(e/p-1)*100;
  document.getElementById("wrows").innerHTML=w.rows.length?w.rows.map(r=>{
    const z=r.sizing, cls=r.side==="short"?"down":"up", basis=r.ema_basis!=="25/50/100"?` <span class="muted">weekly ${r.ema_basis} EMA</span>`:"";
    const orders=z.orders.map(o=>{const now=o.price===r.price, d=pct(o.price,r.price);
      return `<tr><td>${o.share}%</td><td>${now?"<b>now</b>":f(o.price)}</td><td>${fs(o.size)}</td><td>$${o.usd.toFixed(2)}</td><td>${now?"–":d.toFixed(1)+"%"}</td></tr>`;}).join("");
    const merged=r.entry_split.length<3?`<div class="muted">Orders under $10 were merged into the next one, so the split is ${r.entry_split.join(" : ")}.</div>`:"";
    const warn=z.small_orders.length?`<div class="warn">At $${z.risk_usd} risk the whole position is under Hyperliquid's $10 minimum order.</div>`:"";
    return `<article class="card">
      <div class="ch"><span class="coin">${r.coin}</span><b class="${cls}">${r.side==="short"?"Short":"Long"}</b><span class="muted">price ${f(r.price)}</span>${basis}<span class="rr"><b>${r.rr.toFixed(1)}</b> : 1 <span class="muted">· ${r.rr_first_only.toFixed(1)} first only</span></span></div>
      <table><thead><tr><th>Share</th><th>Price</th><th>Size (${r.coin})</th><th>Value</th><th>From price</th></tr></thead><tbody>${orders}</tbody></table>
      <div class="line"><b>Stop</b> ${f(r.stop)} · <b>Take-profit</b> ${r.tps.map(f).join(" then ")}${r.tps.length>1?" (half each)":""}</div>
      <div class="line"><b>Total</b> $${z.notional_usd.toFixed(0)} · <b>Leverage</b> ${z.leverage}× isolated · <b>Margin</b> $${z.margin_usd.toFixed(2)} · <b>Risk</b> $${z.risk_usd.toFixed(2)} <span class="muted">($${z.risk_first_only_usd.toFixed(2)} if only the first fills)</span></div>${merged}${warn}
    </article>`;
  }).join(""):'<p class="muted">No trade passes the rules right now. Stay in cash.</p>';
  const nt=w.trend_no_trade||[];
  const g={};(w.trend_no_trade||[]).forEach(x=>{const k=x.why.startsWith("best zone")?"below the 1.4 : 1 gate":x.why;(g[k]=g[k]||[]).push(`${x.coin} ${x.trend==="down"?"↓":"↑"}`);});
  document.getElementById("wnone").innerHTML=`<b>In a weekly trend, but no trade:</b> `+(Object.keys(g).length?Object.entries(g).map(([k,v])=>`${k[0].toUpperCase()+k.slice(1)}: ${v.join(", ")}`).join(". "):"none")+`. ${c.no_trend} coins have no clear weekly trend; ${c.too_young} have under 25 weeks of history.`;
}).catch(()=>{document.getElementById("wrows").innerHTML='<p class="muted">Trade ideas not built yet.</p>';});
fetch("data/journal.json?t="+Date.now()).then(r=>r.json()).then(j=>{
  const s=j.summary;
  const sm=x=>`${x.trades} closed${x.open?`, ${x.open} open`:""}, ${x.wins} wins, net ${x.net_usd>=0?"+":"−"}$${Math.abs(x.net_usd).toFixed(2)}${x.total_r!=null?`, ${x.total_r>=0?"+":""}${x.total_r}R`:""}`;
  const ws=(j.wallets||[]).map(x=>`wallet ${x.label} since ${x.since}: ${sm(x.summary)}`).join(" · ");
  document.getElementById("meta").textContent=`trade.xyz trades, updated hourly. All wallets: ${sm(s)}.${ws?" "+ws+".":""}`;
  document.getElementById("rows").innerHTML=[...j.trades].reverse().map(t=>{
    const c=t.net>0?"up":t.net<0?"down":"";
    return `<tr><td><b>${t.coin}</b> ${t.side}${t.closed?"":" (open)"}${t.wallet?` <span class="muted">${t.wallet}</span>`:""}</td><td data-label="Opened">${t.opened.slice(5,10)}</td><td data-label="Entry">${f(t.avg_entry)}</td><td data-label="Stop">${f(t.stop)}</td><td data-label="Take-profit">${f(t.tp)}</td><td data-label="Exit">${f(t.avg_exit)}</td><td data-label="Net $" class="${c}">${t.closed?(t.net>=0?"+":"")+t.net.toFixed(2):"–"}</td><td data-label="R" class="${c}">${t.r==null?"–":(t.r>0?"+":"")+t.r}</td></tr>`;
  }).join("");
}).catch(()=>{document.getElementById("rows").innerHTML='<tr><td colspan="8" class="muted">Journal not available.</td></tr>';});
</script>
</body>
</html>
