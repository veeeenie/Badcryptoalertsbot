<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Setup Desk</title>
<style>
:root{--bg:#f6f7f8;--panel:#fff;--ink:#17202a;--muted:#5f6b76;--line:#dfe3e7;--up:#147a52;--down:#b3372b;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11161b;--panel:#182029;--ink:#e6ebf0;--muted:#94a1ad;--line:#28323c;--up:#4cc39a;--down:#ef7a6e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11161b;--panel:#182029;--ink:#e6ebf0;--muted:#94a1ad;--line:#28323c;--up:#4cc39a;--down:#ef7a6e;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:0 16px}
main{max-width:900px;margin:0 auto;padding:28px 0 48px;display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
h1{font-size:26px;margin:0}
a{color:inherit}
.muted{color:var(--muted);font-size:13px}
.box{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
tr:last-child td{border-bottom:0}
.up{color:var(--up)} .down{color:var(--down)}
</style>
</head>
<body>
<main>
  <header><h1>Setup Desk</h1><a href="rules.html">Rule book</a></header>
  <p class="muted" id="meta">Journal of trade.xyz trades since 9 Oct 2026. Being rebuilt one piece at a time.</p>
  <div class="box"><table>
    <thead><tr><th>Trade</th><th>Opened</th><th>Entry</th><th>Stop</th><th>Take-profit</th><th>Exit</th><th>Net $</th><th>R</th></tr></thead>
    <tbody id="rows"><tr><td colspan="8" class="muted">Loading…</td></tr></tbody>
  </table></div>
</main>
<script>
const f=x=>x==null?"–":(Math.abs(x)>=1000?x.toLocaleString("en-US",{maximumFractionDigits:0}):Math.abs(x)>=1?x.toFixed(3):x.toPrecision(3));
fetch("data/journal.json?t="+Date.now()).then(r=>r.json()).then(j=>{
  const s=j.summary;
  document.getElementById("meta").textContent=`Journal of trade.xyz trades since ${j.since} · ${s.trades} closed, ${s.wins} wins, net ${s.net_usd>=0?"+":"−"}$${Math.abs(s.net_usd).toFixed(2)}, ${s.total_r>=0?"+":""}${s.total_r}R · updated hourly`;
  document.getElementById("rows").innerHTML=[...j.trades].reverse().map(t=>{
    const c=t.net>0?"up":t.net<0?"down":"";
    return `<tr><td><b>${t.coin}</b> ${t.side}${t.closed?"":" (open)"}</td><td>${t.opened.slice(5,10)}</td><td>${f(t.avg_entry)}</td><td>${f(t.stop)}</td><td>${f(t.tp)}</td><td>${f(t.avg_exit)}</td><td class="${c}">${t.closed?(t.net>=0?"+":"")+t.net.toFixed(2):"–"}</td><td class="${c}">${t.r==null?"–":(t.r>0?"+":"")+t.r}</td></tr>`;
  }).join("");
}).catch(()=>{document.getElementById("rows").innerHTML='<tr><td colspan="8" class="muted">Journal not available.</td></tr>';});
</script>
</body>
</html>
