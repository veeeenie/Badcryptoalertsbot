<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// Warm editorial style: serif headline, one scene of drawn props acting out the idea, small word-by-word caption pill.
// The recorder injects fonts + timeline, then calls render(t) for each frame.
const C = document.getElementById('c'), X = C.getContext('2d'), W = 1080; let H = 1920;
const P = {bg:'#EFE7DA', bg2:'#E5D8C5', ink:'#2B1E16', acc:'#B5532B', mut:'#7F6C5A', gold:'#D7A544', goldD:'#A6782A',
           sage:'#6E8A62', bull:'#C0643A', bear:'#6B5444', ivory:'#F3E6CF', red:'#B33A2C', paper:'#FBF7EF', line:'#D6C5AD', dark:'#3B2F27', shadow:'rgba(60,40,20,0.16)'};
const SERIF = '"Playfair"', SANS = '"Outfit"';
// Safe area: X's phone player covers roughly the top 12% (back/menu buttons) and bottom 28% (name, post text, buttons).
// Everything sits between y 400 and 1370. Episode prop coordinates (stage y 430-1220) are scaled 0.8 around the centre.
let HEAD_Y = 470, CAP_Y = 1272, HANDLE_Y = 1362, FLOOR = 1196, STAGE = [108, 216, 0.8], CAM_Y = 880, CAP_SIZE = 58, WIDE = false;
// 4:5 (1080x1350, "format": "4:5"): no headline; a small chapter label at the top (beat kind "chapter"), the props are the hero
// (stage at scale 1.0 in y ~265-1055, punches pan less so wide props stay in frame), bigger caption pill at the bottom. X's feed player covers almost nothing at this size.
function useFormat(f) {
  if (f !== '4:5') return; WIDE = true; H = 1350; C.height = H;
  CAP_Y = 1192; HANDLE_Y = 1300; FLOOR = 1085; CAP_SIZE = 66; CAM_Y = 660; STAGE = [0, 660 - 825, 1.0];
}
let TL = null, OPS = [], DUR = 1;
const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const eo = x => 1 - Math.pow(1 - cl(x), 3);
const back = x => { x = cl(x); const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;

function setup(tl) {
  TL = tl; DUR = tl.dur; OPS = []; useFormat(tl.format);
  for (const s of tl.sentences) for (const b of s.beats) OPS.push(b);
  if (tl.hook !== false) OPS.push({kind: 'bg', mode: 'rust', t: 0, auto: true});
  OPS.sort((a, b) => a.t - b.t);
  planCamera();
}

// ---------- camera director (DESIGN.md section 6) ----------
// Every scene is a "shot" with its own angle and slow drift; inside a shot the camera punches in on each new prop
// (alternating hard cuts and snappy eases), and fills any quiet gap over ~2 s with a reframe. Scene changes get a
// transition (rust wipe, zoom-through, whip pan, ink wipe), payoff beats get a shake + flash + light rays.
// Headline, caption pill and handle are an overlay: the camera never moves them, so they stay readable.
const SHOT_TYPES = [
  {z0: 1.00, z1: 1.06, r0: 0, r1: 0, x0: 0,   x1: 0},     // slow push in
  {z0: 1.10, z1: 1.02, r0: 0, r1: 0, x0: 0,   x1: 0},     // pull out
  {z0: 1.05, z1: 1.05, r0: 0, r1: 0, x0: -30, x1: 30},    // pan right
  {z0: 1.05, z1: 1.05, r0: 0, r1: 0, x0: 30,  x1: -30},   // pan left
];
const TRANS = ['wipe', 'zoom', 'whip', 'ink'];
let SHOTS = [], EVENTS = [];
function toScreen(x, y) { return [STAGE[0] + STAGE[2] * x, STAGE[1] + STAGE[2] * y]; }
function planCamera() {
  SHOTS = []; EVENTS = [];
  const clears = [0, ...OPS.filter(o => o.kind === 'clear').map(o => o.t), DUR + 1];
  for (let i = 0; i < clears.length - 1; i++) {
    const t0 = clears[i], t1 = clears[i + 1], ops = OPS.filter(o => o.t >= t0 && o.t < t1 && o.kind !== 'clear');
    const sh = {t0, t1, type: SHOT_TYPES[i % SHOT_TYPES.length], trans: i ? TRANS[(i - 1) % TRANS.length] : null, punches: [], hits: [], cuts: ops.filter(o => o.kind === 'shot')};
    sh.cuts.forEach(c => EVENTS.push({t: c.t, kind: 'punch'}));
    if (sh.trans) EVENTS.push({t: t0, kind: 'trans', trans: sh.trans});
    let last = t0 + 0.2, n = 0, first = true;
    for (const o of ops) {
      if (['ding', 'impact', 'impact_soft', 'riser_hit'].includes(o.sfx)) { sh.hits.push({t: o.t, big: o.sfx !== 'ding'}); EVENTS.push({t: o.t, kind: 'hit'}); }
      if (o.kind === 'add' && o.prop === 'big' && /\d/.test(o.text || '') && !(o.text || '').startsWith('@')) EVENTS.push({t: Math.max(o.t, t0 + 0.25), kind: 'count'});
      const isAdd = o.kind === 'add' || o.kind === 'move' || (o.kind === 'set' && o.sfx);
      if (!isAdd || sh.cuts.length) continue;
      if (first && o.kind === 'add') { first = false; continue; }
      if (o.t - last < 0.6) continue;
      const tgt = OPS.filter(q => q.kind === 'add' && q.id === o.id && q.t <= o.t).pop() || o;
      const [fx, fy] = toScreen(o.x ?? tgt.x ?? 540, o.y ?? tgt.y ?? 820);
      sh.punches.push({t: o.t, fx, fy, n: n++}); last = o.t; EVENTS.push({t: o.t, kind: 'punch'});
    }
    // fill quiet stretches so something moves every ~2 s
    const end = sh.cuts.length ? -1 : Math.min(t1, DUR), marks = [t0 + 0.2, ...sh.punches.map(p => p.t), end];
    for (let j = 0; j < marks.length - 1; j++) for (let tt = marks[j] + 1.9; tt < marks[j + 1] - 0.8; tt += 1.9) {
      sh.punches.push({t: tt, fx: 540 + (n % 2 ? 60 : -60), fy: CAM_Y - 20, n: n++, re: true}); EVENTS.push({t: tt, kind: 'punch'}); }
    sh.punches.sort((a, b) => a.t - b.t);
    SHOTS.push(sh);
  }
  EVENTS.sort((a, b) => a.t - b.t);
  return EVENTS;
}
const eio = x => { x = cl(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
function camAt(t) {
  const sh = SHOTS.find(s => t >= s.t0 && t < s.t1) || SHOTS[SHOTS.length - 1];
  if (!sh) return {z: 1, r: 0, x: 0, y: 0, blur: 0, ghost: 0};
  const T = sh.type, u = eio((t - sh.t0) / Math.max(1, Math.min(sh.t1, DUR) - sh.t0));
  let z = lerp(T.z0, T.z1, u), r = lerp(T.r0, T.r1, u), x = lerp(T.x0, T.x1, u), y = 0;
  // punches: each one steps the framing toward the new prop; odd ones are hard cuts, even ones fast eases
  let pz = 0, px = 0, py = 0, pr = 0;
  for (const p of sh.punches) { if (p.t > t) break;
    const k = p.n % 2 ? 1 : eo((t - p.t) / 0.22), amt = p.n % 2 ? 0.075 : 0.045;
    const tz = amt, tx = (540 - p.fx) * (WIDE ? 0.15 : 0.35), ty = (CAM_Y - p.fy) * 0.3, tr = 0;
    pz = lerp(pz, tz, k); px = lerp(px, tx, k); py = lerp(py, ty, k); pr = lerp(pr, tr, k); }
  z += pz; x += px; y += py; r += pr;
  const cut = sh.cuts.filter(c => c.t <= t).pop();
  if (cut) { const [fx, fy] = toScreen(cut.x ?? 540, cut.y ?? 825); z = (cut.z || 1) * (1 + 0.035 * cl((t - cut.t) / 2.5)); x = -z * (fx - W / 2); y = -z * (fy - CAM_Y); r = 0; }
  // hits: short shake
  let sx = 0, sy = 0, flash = 0, rays = null;
  for (const h of sh.hits) { const a = t - h.t; if (a < 0 || a > 0.9) continue;
    const amp = (h.big ? 16 : 9) * Math.exp(-a * 9); sx += Math.sin(a * 95) * amp; sy += Math.cos(a * 71) * amp * 0.7;
    flash = Math.max(flash, (h.big ? 0.32 : 0.2) * (1 - cl(a / 0.14))); z += 0.03 * Math.exp(-a * 12); rays = {a}; }
  // transitions around the cut at sh.t0 (incoming) and sh.t1 (outgoing)
  let blur = 0, ghost = 0; const next = SHOTS[SHOTS.indexOf(sh) + 1];
  const tin = sh.trans, ain = t - sh.t0, tout = next && next.trans, aout = sh.t1 - t;
  if (tout === 'zoom' && aout < 0.16) { const k = 1 - aout / 0.16; z *= 1 + 0.45 * k * k; blur = 12 * k; }
  if (tin === 'zoom' && ain < 0.25) { const k = 1 - eo(ain / 0.25); z *= 1 - 0.12 * k; blur = Math.max(blur, 8 * k); }
  if (tout === 'whip' && aout < 0.14) { const k = 1 - aout / 0.14; x -= W * 0.9 * k * k; ghost = k; }
  if (tin === 'whip' && ain < 0.26) { const k = 1 - eo(ain / 0.26); x += W * 0.9 * k; ghost = Math.max(ghost, k); }
  return {z, r: r * Math.PI / 180, x: x + sx, y: y + sy, blur, ghost, flash, rays, sh};
}
function wipe(t) { // rust or ink panel sweeping across the cut
  for (const sh of SHOTS) { if (sh.trans !== 'wipe' && sh.trans !== 'ink') continue; const u = (t - (sh.t0 - 0.16)) / 0.4; if (u < 0 || u > 1) continue;
    const e = eio(u), sk = 220, col = sh.trans === 'wipe' ? P.acc : P.dark;
    X.save(); X.fillStyle = col; X.beginPath();
    if (sh.trans === 'wipe') { const xl = lerp(-W - sk, W + sk, e); X.moveTo(xl, 0); X.lineTo(xl + W, 0); X.lineTo(xl + W - sk, H); X.lineTo(xl - sk, H); }
    else { const yt = lerp(H + sk, -H - sk, e); X.moveTo(0, yt); X.lineTo(W, yt - sk); X.lineTo(W, yt - sk + H); X.lineTo(0, yt + H); }
    X.fill(); X.restore(); }
}
let OFF = null;
function postBlur(px, ghost) { // whole-frame blur (zoom cut) or horizontal smear (whip)
  if (!OFF) { OFF = document.createElement('canvas'); OFF.width = W; OFF.height = H; }
  const o = OFF.getContext('2d'); o.setTransform(1, 0, 0, 1, 0, 0); o.filter = 'none'; o.clearRect(0, 0, W, H); o.drawImage(C, 0, 0);
  X.save(); X.setTransform(1, 0, 0, 1, 0, 0);
  if (px > 0.3) { X.filter = `blur(${px}px)`; X.drawImage(OFF, 0, 0); X.filter = 'none'; }
  if (ghost > 0.05) { for (let i = 1; i <= 5; i++) { X.globalAlpha = 0.22; X.drawImage(OFF, i * 26 * ghost, 0); X.drawImage(OFF, -i * 26 * ghost, 0); } }
  X.restore();
}

// ---------- text helpers ----------
function font(fam, w, sz, it) { return `${it ? 'italic ' : ''}${w} ${sz}px ${fam}`; }
// "Same *start.*" -> runs [{t:'Same ',a:false},{t:'start.',a:true}]
function runs(s) { const r = []; s.split(/(\*[^*]+\*)/).forEach(p => { if (!p) return; const a = p.startsWith('*'); r.push({t: a ? p.slice(1, -1) : p, a}); }); return r; }
function wrapRuns(rs, maxW, f) { // split into words keeping accent flag, then lines
  X.font = f; const words = []; rs.forEach(r => r.t.split(/(\s+)/).forEach(w => { if (w && !/^\s+$/.test(w)) words.push({t: w, a: r.a}); }));
  const lines = [[]]; let cw = 0; const sp = X.measureText(' ').width;
  words.forEach(w => { const ww = X.measureText(w.t).width; if (cw && cw + sp + ww > maxW) { lines.push([]); cw = 0; } lines[lines.length - 1].push(w); cw += (cw ? sp : 0) + ww; });
  return lines;
}
function drawRunsCentered(lines, cx, y, lh, f, col, accCol) {
  X.font = f; X.textBaseline = 'alphabetic'; const sp = X.measureText(' ').width;
  lines.forEach((ln, i) => { let tw = ln.reduce((s, w) => s + X.measureText(w.t).width, 0) + sp * (ln.length - 1); let x = cx - tw / 2;
    ln.forEach(w => { X.fillStyle = w.a ? accCol : col; X.fillText(w.t, x, y + i * lh); x += X.measureText(w.t).width + sp; }); });
}
function text(s, x, y, f, col, align = 'center', base = 'middle') { X.font = f; X.fillStyle = col; X.textAlign = align; X.textBaseline = base; X.fillText(s, x, y); X.textAlign = 'left'; }
function rr(x, y, w, h, r) { X.beginPath(); X.roundRect(x, y, w, h, r); }
function shadow(x, y, rx, ry, a = 1) { X.save(); X.globalAlpha *= a; X.fillStyle = P.shadow; X.beginPath(); X.ellipse(x, y, rx, ry, 0, 0, 7); X.filter = 'blur(6px)'; X.fill(); X.restore(); }

// ---------- design tokens (content/DESIGN.md) ----------
// New props are built from these helpers and numbers, not their own, so every scene looks like the same account.
const DS = {stroke: 7, thin: 3, radius: 22, small: 180, medium: 300, large: 440,
            type: {head: 104, num: 120, label: 50, note: 42, small: 34}};
// Paper card (white-ish, thin edge, floor shadow), centred on 0,0.
function card(w, h, rot = 0) { X.rotate(rot); shadow(0, h / 2 + 18, w * 0.42, 12); X.fillStyle = P.paper; rr(-w / 2, -h / 2, w, h, DS.radius); X.fill(); X.strokeStyle = P.line; X.lineWidth = DS.thin; X.stroke(); }
// Solid object (machine, box, block), centred on 0,0. fill: a palette colour (dark by default).
function solid(w, h, fill) { shadow(0, h / 2 + 18, w * 0.42, 12); X.fillStyle = fill || P.dark; rr(-w / 2, -h / 2, w, h, DS.radius); X.fill(); }
// Ink outline for drawn objects (the agent's head, icons).
function ink(w) { X.strokeStyle = P.ink; X.lineWidth = w || DS.stroke; X.lineCap = 'round'; X.lineJoin = 'round'; }
// Text roles: a caption under a prop, a big serif number, a small note.
function lbl(s, y, col) { text(s, 0, y, font(SANS, 600, DS.type.label), col || P.mut); }
function num(s, y, col) { text(s, 0, y, font(SERIF, 800, DS.type.num), col || P.ink); }
function note(s, y) { text(s, 0, y, font(SANS, 500, DS.type.note), P.mut); }

// ---------- background ----------
const DECOR = [[50, 640, 36, 0.2, 1], [1030, 560, 32, 1.7, 0], [1025, 1080, 42, 3.1, 1], [55, 1150, 30, 4.4, 0], [985, 1700, 40, 5.2, 0], [95, 1730, 44, 2.6, 1]];
const DECOR45 = [[46, 260, 34, 0.2, 1], [1034, 200, 30, 1.7, 0], [1030, 760, 40, 3.1, 1], [50, 900, 30, 4.4, 0], [990, 1240, 38, 5.2, 0], [90, 1260, 42, 2.6, 1]];
// Rust hook / catch frame: full rust background with a cream spotlight where the scene plays. It stands out against
// both X's white and black feeds; used on the first scene (auto) and on "the catch" ({"kind":"bg","mode":"rust"}).
function rustFrame(t, t0) {
  const k = eo((t - t0) / 0.25), r = (H > 1500 ? 470 : 430) * (0.85 + 0.15 * k) + Math.sin(t * 2.2) * 6;
  X.fillStyle = P.acc; X.fillRect(-200, -200, W + 400, H + 400);
  X.fillStyle = 'rgba(255,240,225,0.10)'; for (let i = 0; i < 12; i++) { X.save(); X.translate(W / 2, CAM_Y); X.rotate(i * Math.PI / 6 + t * 0.15); X.beginPath(); X.moveTo(0, 0); X.lineTo(1400, -120); X.lineTo(1400, 120); X.closePath(); X.fill(); X.restore(); }
  X.fillStyle = P.bg; X.beginPath(); X.arc(W / 2, CAM_Y, r, 0, 7); X.fill(); X.strokeStyle = P.paper; X.lineWidth = 10; X.stroke();
}
function background(t) {
  X.fillStyle = P.bg; X.fillRect(0, 0, W, H);
  let g = X.createRadialGradient(W / 2, H * 0.36, 100, W / 2, H * 0.42, H * 0.57); g.addColorStop(0, 'rgba(255,250,240,0.55)'); g.addColorStop(1, 'rgba(255,250,240,0)'); X.fillStyle = g; X.fillRect(0, 0, W, H);
  g = X.createLinearGradient(0, FLOOR, 0, H); g.addColorStop(0, P.bg2); g.addColorStop(1, '#DCCDB8'); X.fillStyle = g; X.fillRect(0, FLOOR, W, H - FLOOR);
  X.fillStyle = P.line; X.fillRect(0, FLOOR - 2, W, 4);
  (WIDE ? DECOR45 : DECOR).forEach(([x, y, r, ph, blur]) => { X.save(); X.globalAlpha = blur ? 0.32 : 0.55; if (blur) X.filter = 'blur(5px)';
    coinFace(x + Math.sin(t * 0.5 + ph) * 6, y + Math.sin(t * 0.8 + ph) * 10, r, '', Math.sin(t * 0.6 + ph) * 0.3); X.restore(); });
  g = X.createRadialGradient(W / 2, H / 2, H * 0.31, W / 2, H / 2, H * 0.65); g.addColorStop(0, 'rgba(60,40,20,0)'); g.addColorStop(1, 'rgba(60,40,20,0.18)'); X.fillStyle = g; X.fillRect(0, 0, W, H);
}

// ---------- props ----------
function coinFace(x, y, r, label, rot = 0) {
  X.save(); X.translate(x, y); X.rotate(rot);
  X.fillStyle = P.goldD; X.beginPath(); X.ellipse(0, r * 0.08, r, r, 0, 0, 7); X.fill();
  X.fillStyle = P.gold; X.beginPath(); X.arc(0, 0, r, 0, 7); X.fill();
  X.strokeStyle = 'rgba(120,80,20,0.45)'; X.lineWidth = Math.max(2, r * 0.07); X.beginPath(); X.arc(0, 0, r * 0.74, 0, 7); X.stroke();
  if (label) text(label, 0, r * 0.04, font(SERIF, 800, r * (label.length > 3 ? 0.42 : 0.62)), '#7A5418');
  X.restore();
}
function disc(x, y, r) { // one coin seen from the side, for stacks
  X.fillStyle = P.goldD; X.beginPath(); X.ellipse(x, y + 9, r, r * 0.3, 0, 0, 7); X.fill(); X.fillRect(x - r, y, 2 * r, 9);
  X.fillStyle = P.gold; X.beginPath(); X.ellipse(x, y, r, r * 0.3, 0, 0, 7); X.fill();
  X.strokeStyle = 'rgba(120,80,20,0.35)'; X.lineWidth = 2; X.beginPath(); X.ellipse(x, y, r * 0.72, r * 0.21, 0, 0, 7); X.stroke();
}
function countUp(s, a) { // "866%" -> counts 0..866 over 0.7 s, keeping prefix, decimals and commas
  const m = /^([^\d@]*)([\d,]*\.?\d+)(.*)$/.exec(s || ''); if (!m || a == null || a >= 0.75) return s;
  const raw = m[2].replace(/,/g, ''), dec = (raw.split('.')[1] || '').length, v = parseFloat(raw) * eo(a / 0.75);
  let o = v.toFixed(dec); if (m[2].includes(',')) o = Number(o).toLocaleString('en-US', {minimumFractionDigits: dec, maximumFractionDigits: dec});
  return m[1] + o + m[3]; }
function raysAt(cx, cy, a) { // light rays behind a payoff, 0.7 s
  const k = cl(a / 0.15) * (1 - cl((a - 0.35) / 0.4)); if (k <= 0) return; X.save(); X.translate(cx, cy); X.rotate(a * 0.6); X.globalAlpha = 0.55 * k; X.fillStyle = P.paper;
  for (let i = 0; i < 14; i++) { X.rotate(Math.PI * 2 / 14); X.beginPath(); X.moveTo(0, 0); X.lineTo(900, -70); X.lineTo(900, 70); X.closePath(); X.fill(); } X.restore(); }
function anim(o, k, t, dur, ease) { // value of a numeric field, eased from its previous value after a set
  if (o[k + '_t'] == null) return o[k]; return lerp(o[k + '_0'], o[k], (ease || eo)((t - o[k + '_t']) / dur)); }
function overshoot(x) { x = cl(x); return x === 1 ? 1 : 1 - Math.pow(2, -9 * x) * Math.cos(x * 9); }
// Characters: the bull is the longs, the bear is the shorts. mood: calm|happy|sad|shock|sweat, action: pay|cheer|hold, dir 1/-1, tag (small word under the feet)
function character(o, t, a, kind) {
  const s = o.s || 1, d = o.dir || (kind === 'bull' ? 1 : -1), col = P[kind], mood = o.mood || 'calm', act = o.action || '';
  const bob = mood === 'shock' ? 0 : Math.sin(t * 4.2 + (kind === 'bull' ? 0 : 1.7) + (o.ph || 0)) * 5, jit = mood === 'shock' ? Math.sin(t * 70) * 2.5 : 0;
  const hop = act === 'cheer' ? Math.abs(Math.sin(t * 7)) * -18 : 0;
  X.scale(s, s); shadow(0, 166, 120, 14);
  if (o.tag) text(o.tag, 0, 215, font(SANS, 600, 46), P.mut);
  X.save(); X.scale(d, 1);
  X.fillStyle = P.dark; rr(-72, 104, 54, 58, 22); X.fill(); rr(18, 104, 54, 58, 22); X.fill();
  X.translate(jit, bob + hop);
  const arm = (sx, ang, front) => { const L = 92, hx = sx + Math.cos(ang) * L * Math.sign(sx), hy = 18 + Math.sin(ang) * L;
    X.strokeStyle = col; X.lineWidth = 38; X.lineCap = 'round'; X.beginPath(); X.moveTo(sx, 18); X.lineTo(hx, hy); X.stroke(); X.lineCap = 'butt';
    if (front && act === 'pay') coinFace(hx + 6, hy - 6, 30, '', Math.sin(t * 6) * 0.3);
    return [hx, hy]; };
  const pay = Math.sin(t * 6) * 0.12, cheer = Math.sin(t * 9) * 0.25;
  const angF = act === 'pay' ? -0.25 + pay : act === 'cheer' ? -1.15 + cheer : act === 'hold' ? -0.1 : 1.15;
  const angB = act === 'cheer' ? -1.15 - cheer : 1.2;
  arm(-100, angB, false);
  X.fillStyle = col; rr(-122, -62, 244, 196, 92); X.fill();
  X.fillStyle = 'rgba(255,250,240,0.26)'; X.beginPath(); X.ellipse(0, 48, 72, 60, 0, 0, 7); X.fill();
  const hy = -128;
  if (kind === 'bull') {
    X.strokeStyle = P.ivory; X.lineWidth = 26; X.lineCap = 'round';
    [-1, 1].forEach(k => { X.beginPath(); X.moveTo(k * 62, hy - 70); X.quadraticCurveTo(k * 130, hy - 80, k * 128, hy - 140); X.stroke(); });
    X.lineCap = 'butt'; X.fillStyle = col; [-1, 1].forEach(k => { X.save(); X.translate(k * 104, hy - 30); X.rotate(k * 0.5); X.beginPath(); X.ellipse(0, 0, 34, 18, 0, 0, 7); X.fill(); X.restore(); });
  } else {

// ---------- state at time t ----------
function stateAt(t) {
  const objs = new Map(); let head = null, headPrev = null, lastClear = -9, chap = null, chapPrev = null, bg = null;
  for (const op of OPS) { if (op.t > t) break;
    if (op.kind === 'head') { headPrev = head; head = {text: op.text, t: op.t}; continue; }
    if (op.kind === 'chapter') { chapPrev = chap; chap = {text: op.text, t: op.t}; continue; }
    if (op.kind === 'bg') { bg = {mode: op.mode, t: op.t}; continue; }
    if (op.kind === 'clear') { lastClear = op.t; bg = null; for (const o of objs.values()) if (o.die == null) o.die = op.t; continue; }
    if (op.kind === 'add') { const o = Object.assign({}, op, {born: op.t - lastClear < 0.25 ? lastClear + 0.25 : op.t}); objs.delete(op.id || ('o' + op.t)); o.x = op.x ?? 540; o.y = op.y ?? 820; objs.set(op.id || ('o' + op.t), o); continue; }
    const o = objs.get(op.id); if (!o) continue; const t0 = Math.max(op.t, o.born);
    if (op.kind === 'move') { const k = eo((t - t0) / (op.dur || 0.6)); o.x = lerp(o.x, op.x ?? o.x, k); o.y = lerp(o.y, op.y ?? o.y, k); if (op.s != null) o.s = lerp(o.s ?? 1, op.s, k); }
    else if (op.kind === 'set') { for (const [k, v] of Object.entries(op)) if (!['kind', 't', 'id', 'sfx'].includes(k)) { if (typeof v === 'number') { o[k + '_0'] = typeof o[k] === 'number' ? o[k] : v; o[k + '_t'] = op.t; } o[k] = v; o[k + '_set'] = op.t; if (k === 'upto') o['t' + (v - 1)] = op.t; } }
    else if (op.kind === 'remove') o.die = op.t;
  }
  return {objs, head, headPrev, chap, chapPrev, bg};
}

function drawHead(h, t, out) {
  if (!h) return; const a = out ? 1 - eo((t - out) / 0.2) : 1; if (a <= 0) return;
  const f = font(SERIF, 800, 104); const lines = wrapRuns(runs(h.text), 940, f); X.font = f; X.textBaseline = 'alphabetic'; const sp = X.measureText(' ').width;

    const y = HEAD_Y - (lines.length - 1) * 56 + li * 118 + (out ? -24 * (1 - a) : 0);
    ln.forEach(w => { const ww = X.measureText(w.t).width, t0 = h.t + 0.1 + (wi++) * 0.085, k = out ? 1 : cl((t - t0) / 0.26);

        else if (w.a) { X.fillStyle = 'rgba(181,83,43,0.16)'; rr(x - 8, y - 26, ww + 16, 30, 8); X.fill(); }
        X.save(); X.globalAlpha *= cl(k * 1.6); X.translate(x + ww / 2, y + dy - 36); X.scale(sc, sc); X.fillStyle = w.a ? P.acc : P.ink; X.textAlign = 'center'; X.fillText(w.t, 0, 36); X.restore(); }
      x += ww + sp; }); });
  X.restore(); X.textAlign = 'left';

function drawChapter(c, t, out) { // small label at the top of a 4:5 video: rust dot + text on a paper pill; slides in on change
  if (!c) return; const a = out ? 1 - eo((t - out) / 0.18) : eo((t - c.t) / 0.3); if (a <= 0) return;
  X.font = font(SANS, 600, 40); const tw = X.measureText(c.text).width, w = tw + 104, h = 76, y = 78, x = W / 2 + (out ? -60 * (1 - a) : 90 * (1 - a));
  X.save(); X.globalAlpha = a; X.fillStyle = P.paper; rr(x - w / 2, y - h / 2, w, h, h / 2); X.fill(); X.strokeStyle = P.line; X.lineWidth = DS.thin; X.stroke();

function caption(t) {

  const pw = tw + 70, ph = CAP_SIZE * 1.8, y = CAP_Y, pk = 1 + 0.14 * (1 - eo((t - chunk[0].s) / 0.2)); X.save(); X.translate(W / 2, y); X.scale(pk, pk); X.translate(-W / 2, -y);
  X.fillStyle = 'rgba(255,252,246,0.7)'; rr(W / 2 - pw / 2, y - ph / 2, pw, ph, 26); X.fill();

function render(t) {
  X.setTransform(1, 0, 0, 1, 0, 0); X.globalAlpha = 1; X.filter = 'none';
  const cam = camAt(t), st = stateAt(t), CX = W / 2, CY = CAM_Y;
  X.save(); X.translate(CX + cam.x, CY + cam.y); X.rotate(cam.r); X.scale(cam.z, cam.z); X.translate(-CX, -CY);
  X.save(); X.translate(CX, CY); X.scale(1.12, 1.12); X.translate(-CX, -CY); background(t); if (st.bg && st.bg.mode === 'rust') rustFrame(t, st.bg.t); X.restore(); // oversize so tilts never show corners

  X.save(); X.translate(STAGE[0], STAGE[1]); X.scale(STAGE[2], STAGE[2]);

}
